<body>

<nav>
<h2>CurrencyApp</h2><br>
<a href="home.html">home page</a></button>&nbsp; 
       <button> <a href="full.html">full converterpage</a></button>&nbsp; &nbsp;

           <button> <a href="history.html">history page</a></button>&nbsp; &nbsp; 
<button> <a href="seting.html">setting page</a></button>&nbsp;
</nav>
<h1>Currency Converter</h1>

<div class="converter-box">

<input id="amount" type="number" placeholder="Enter Amount">
<label>From:</label>
<select id="from">
<option value="USD">USD</option>
<option value="RWF">RWF</option>
<option value="EUR">EUR</option>
</select>

<button onclick="swap()">↔</button>
<label>to:</label>
<select id="to">
<option value="RWF">RWF</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>
</select>

<button id="convertBtn">Convert</button>

<div id="result">
<p>Result will appear here</p>
</div>

</div>

<!-- JAVASCRIPT -->
<script>

const rates = {
USD: 1,
RWF: 1400,
EUR: 0.9
};

document.getElementById("convertBtn")
.addEventListener("click", convertCurrency);

function convertCurrency(){

let amount = document.getElementById("amount").value;
let from = document.getElementById("from").value;
let to = document.getElementById("to").value;

if(amount === ""){
document.getElementById("result").innerHTML =
"<p>Please enter amount</p>";
return;
}

let usdAmount = amount / rates[from];
let finalAmount = usdAmount * rates[to];

document.getElementById("result").innerHTML =
"<h3>" + amount + " " + from +
" = " + finalAmount.toFixed(2) +
" " + to + "</h3>";
}

function swap(){

let from = document.getElementById("from");
let to = document.getElementById("to");

let temp = from.value;
from.value = to.value;
to.value = temp;

}

</script>
